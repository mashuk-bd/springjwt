spring.application.name=springjwt

spring.security.user.name=abc
spring.security.user.password=abc123

logging.level.org.springframework.security=DEBUG

jwt.secret=your-256-bit-secret-key-must-be-at-least-256-bits-long-here
# Short-lived access token expiration in seconds (default: 900 = 15 minutes)
jwt.expiration=900
# Inactivity timeout - user will be logged out after this duration of inactivity in seconds (default: 600 = 10 minutes)
jwt.inactivity-timeout=600
# Maximum session duration regardless of activity in seconds (default: 86400 = 24 hours)
jwt.max-session-duration=86400
